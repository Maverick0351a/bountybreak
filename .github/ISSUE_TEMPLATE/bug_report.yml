name: Bug report
description: Report a reproducible ScopeRook defect without including bounty or credential data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ScopeRook. Remove program-private text, credentials, session material, customer data, exploit payloads, and target evidence before posting.
  - type: input
    id: version
    attributes:
      label: ScopeRook version or commit
      placeholder: v0.8.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Dashboard
        - Daybreak MCP server
        - Compatibility MCP server
        - Portfolio and history
        - Public intelligence
        - Importer
        - Synthetic lab
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: Use synthetic or redacted data only.
      placeholder: |
        1. Start ScopeRook with ...
        2. Create a synthetic engagement ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I removed secrets, private program text, customer data, session material, and live target evidence.
          required: true
