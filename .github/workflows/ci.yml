name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python modules
        run: >-
          python -m py_compile
          agent_workflow.py
          ai_local.py
          hunt_portfolio.py
          integration_catalog.py
          nuclei_template_import.py
          sandbox_runner.py
          scoperook_daybreak_server.py
          scoperook_mcp.py
          surface_import.py
          tool_router.py
          workbench.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
