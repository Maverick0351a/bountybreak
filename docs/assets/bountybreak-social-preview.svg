<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">BountyBreak social preview</title>
  <desc id="desc">BountyBreak. Bug bounty operations for approved Daybreak Blue workflows.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d18"/>
      <stop offset="0.64" stop-color="#071a2d"/>
      <stop offset="1" stop-color="#0d3153"/>
    </linearGradient>
    <radialGradient id="dawn" cx="0.82" cy="0.12" r="0.72">
      <stop offset="0" stop-color="#2d8cff" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#1769aa" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06111f" stop-opacity="0.88"/>
      <stop offset="0.22" stop-color="#06111f" stop-opacity="0"/>
      <stop offset="1" stop-color="#06111f" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screenClip"><rect x="650" y="112" width="574" height="430" rx="12"/></clipPath>
    <filter id="screenShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#eaf3ff" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#dawn)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="0" y="0" width="10" height="640" fill="#2d8cff"/>

  <g transform="translate(74 58)">
    <rect x="1" y="1" width="66" height="66" rx="14" fill="#0b1b2d" stroke="#2d8cff" stroke-width="2"/>
    <path d="M9 21V11h10M49 11h10v10M9 47v10h10M49 57h10V47" fill="none" stroke="#71c7ff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M18 45h32" fill="none" stroke="#2d8cff" stroke-width="2" stroke-linecap="round"/>
    <path d="M25 45a9 9 0 0 1 18 0" fill="#ffb35c" fill-opacity="0.16" stroke="#ffb35c" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M34 18v8M23 23l5 5M45 23l-5 5" fill="none" stroke="#eaf3ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="34" cy="34" r="3" fill="#eaf3ff"/>
  </g>
  <text x="161" y="103" fill="#eaf3ff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="650" letter-spacing="0.2">BountyBreak</text>

  <text x="76" y="232" fill="#eaf3ff" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.2">Bug bounty</text>
  <text x="76" y="304" fill="#eaf3ff" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.2">operations.</text>

  <path d="M78 350h70" stroke="#2d8cff" stroke-width="4"/>
  <text x="76" y="397" fill="#b8cee2" font-family="Segoe UI, Arial, sans-serif" font-size="23">Designed for approved</text>
  <text x="76" y="430" fill="#b8cee2" font-family="Segoe UI, Arial, sans-serif" font-size="23">Daybreak Blue workflows.</text>

  <text x="76" y="550" fill="#7f9bb7" font-family="Consolas, monospace" font-size="16" letter-spacing="1.7">INDEPENDENT   /   LOCAL-FIRST   /   MCP</text>
  <text x="76" y="584" fill="#617e9a" font-family="Consolas, monospace" font-size="14">PYTHON 3.11+ · STANDARD LIBRARY</text>

  <g filter="url(#screenShadow)">
    <rect x="647" y="109" width="580" height="436" rx="15" fill="#06111f" stroke="#2d5d88" stroke-width="2"/>
    <image x="650" y="112" width="574" height="430" preserveAspectRatio="xMidYMid slice" clip-path="url(#screenClip)" href="bountybreak-overview.png" xlink:href="bountybreak-overview.png"/>
    <rect x="650" y="112" width="574" height="430" rx="12" fill="url(#screenFade)"/>
  </g>

  <path d="M650 576h574" stroke="#203a59"/>
  <circle cx="1170" cy="576" r="4" fill="#ffb35c"/>
  <text x="1152" y="581" fill="#7f9bb7" font-family="Consolas, monospace" font-size="13" text-anchor="end">LOCAL OPERATOR DESK</text>
